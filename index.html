<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAG Chatbot</title>
<style>
  :root{--bg:#0f1115;--panel:#181b22;--user:#2f6fed;--bot:#232733;--text:#e8eaf0;--muted:#8b91a1}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;justify-content:center}
  .app{width:100%;max-width:760px;height:100%;display:flex;flex-direction:column;background:var(--panel)}
  header{padding:14px 18px;border-bottom:1px solid #2a2e3a;display:flex;justify-content:space-between;align-items:center}
  header h1{font-size:17px;margin:0}
  header button{background:none;border:1px solid #3a3f4e;color:var(--muted);border-radius:8px;padding:5px 10px;cursor:pointer}
  header button:hover{color:var(--text)}
  #messages{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:80%;padding:10px 14px;border-radius:14px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
  .user{align-self:flex-end;background:var(--user);border-bottom-right-radius:4px}
  .bot{align-self:flex-start;background:var(--bot);border-bottom-left-radius:4px}
  .error{background:#4a2226;color:#ffb4b4}
  .typing{color:var(--muted);font-style:italic}
  form{display:flex;gap:10px;padding:14px;border-top:1px solid #2a2e3a}
  textarea{flex:1;resize:none;background:var(--bg);color:var(--text);border:1px solid #2f3442;border-radius:10px;padding:10px 12px;font:inherit;max-height:140px}
  textarea:focus{outline:none;border-color:var(--user)}
  #send{background:var(--user);color:#fff;border:0;border-radius:10px;padding:0 20px;font-weight:600;cursor:pointer}
  #send:disabled{opacity:.5;cursor:not-allowed}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>🤖 RAG Chatbot</h1>
    <button id="clear" type="button">New chat</button>
  </header>
  <div id="messages"></div>
  <form id="form">
    <textarea id="input" rows="1" placeholder="Type your message... (Enter to send, Shift+Enter for new line)"></textarea>
    <button id="send" type="submit">Send</button>
  </form>
</div>

<script>
  // ====== CONFIG ======
  // While testing (workflow must be listening via "Execute workflow"):
  const WEBHOOK_URL = "https://ziadaccount3.app.n8n.cloud/webhook-test/ChatBot";
  // For deployment, publish the workflow and switch to the production URL:
  // const WEBHOOK_URL = "https://ziadaccount3.app.n8n.cloud/webhook/ChatBot";
  // =====================

  const messagesEl = document.getElementById("messages");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");

  // Session id so the "Simple Memory" node can keep conversation context
  function newSession() {
    return "sess-" + Date.now() + "-" + Math.random().toString(36).slice(2, 8);
  }
  let sessionId = localStorage.getItem("chat_session") || newSession();
  localStorage.setItem("chat_session", sessionId);

  function addMessage(text, cls) {
    const div = document.createElement("div");
    div.className = "msg " + cls;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  // Response arrives as {"Response": JSON.stringify($json.output)}
  // so it's usually a JSON-encoded string, e.g. "\"Hello\\nworld\"" -> decode it.
  function extractText(data) {
    let r = data && data.Response !== undefined ? data.Response : data;
    if (typeof r === "string") {
      try { r = JSON.parse(r); } catch (e) { /* already plain text */ }
    }
    if (typeof r === "string") return r;
    return JSON.stringify(r, null, 2);
  }

  async function sendMessage(text) {
    addMessage(text, "user");
    const typing = addMessage("Thinking...", "bot typing");
    sendBtn.disabled = true;
    try {
      const res = await fetch(WEBHOOK_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ chatInput: text, sessionId })
      });
      if (!res.ok) throw new Error("Server returned " + res.status);
      const raw = await res.text();
      let data;
      try { data = JSON.parse(raw); } catch (e) { data = raw; }
      typing.className = "msg bot";
      typing.textContent = extractText(data);
    } catch (err) {
      typing.className = "msg bot error";
      typing.textContent = "Error: " + err.message;
    } finally {
      sendBtn.disabled = false;
      input.focus();
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }
  }

  form.addEventListener("submit", e => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text || sendBtn.disabled) return;
    input.value = "";
    input.style.height = "auto";
    sendMessage(text);
  });

  input.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });
  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 140) + "px";
  });

  document.getElementById("clear").addEventListener("click", () => {
    messagesEl.innerHTML = "";
    sessionId = newSession();
    localStorage.setItem("chat_session", sessionId);
    addMessage("Hi! Ask me anything about your documents.", "bot");
  });

  addMessage("Hi! Ask me anything about your documents.", "bot");
</script>
</body>
</html>
